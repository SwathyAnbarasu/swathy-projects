<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | AI Analyzer</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      min-height: 150vh; /* ✅ makes the page scrollable */
      background: 
        
        url("{{ url_for('static', filename='backgrounds/login_bg.jpg') }}") no-repeat center center/cover;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      overflow-x: hidden;
      overflow-y: scroll;
      position: relative;
    }
/* Logo zoom animation */
@keyframes zoomInOut {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.15);
  }
}

.logo {
  width: 100px;
  height: 100px;
  object-fit: contain;
  margin-bottom: 10px;
  border-radius: 50%;
  box-shadow: 0 0 15px rgba(255,255,255,0.5);
  animation: zoomInOut 3s ease-in-out infinite; /* 👈 animation added */
}

    .container {
      margin-top: 15vh;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 40px;
      width: 340px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      color: #fff;
      z-index: 2;
      position: relative;
    }

    .logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 10px;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(255,255,255,0.5);
    }

    h2 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      border: none;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #007bff;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover { background: #0056b3; }

    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      animation: float 10s infinite ease-in-out;
      z-index: 0;
    }

    @keyframes float {
      from { transform: translateY(100vh); opacity: 0.6; }
      to { transform: translateY(-10vh); opacity: 1; }
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 123, 255, 0.5);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 123, 255, 0.8);
    }

    .error, .success, .info { margin-bottom: 10px; font-size: 0.9em; }
    .error { color: #ffb3b3; }
    .success { color: #b3ffb3; }
    .info { color: #cce5ff; }
  </style>
</head>
<body>
  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div style="position:absolute;top:15px;text-align:center;width:100%;z-index:3;">
      {% for category, msg in messages %}
        <p class="{{ category }}">{{ msg }}</p>
      {% endfor %}
    </div>
  {% endif %}
  {% endwith %}

  <div class="container">
    <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="AI Analyzer Logo" class="logo">
    <h2>🔐 Login</h2>
    <form method="POST">
      <input type="text" name="username" placeholder="Enter Username" required>
      <input type="password" name="password" placeholder="Enter Password" required>
      <button type="submit">Login</button>
    </form>
    <p>Don't have an account? 
      <a href="{{ url_for('register') }}" style="color:#fff;">Register</a>
    </p>
  </div>

  <script>
    // ✅ Generate floating bubbles dynamically
    for (let i = 0; i < 25; i++) {
      const bubble = document.createElement('div');
      bubble.classList.add('bubble');
      bubble.style.width = bubble.style.height = `${Math.random() * 60 + 20}px`;
      bubble.style.left = `${Math.random() * 100}vw`;
      bubble.style.animationDuration = `${Math.random() * 6 + 4}s`;
      bubble.style.animationDelay = `${Math.random() * 3}s`;
      document.body.appendChild(bubble);
    }
  </script>
</body>
</html>
